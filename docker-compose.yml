services:
    overwatch-db:
        container_name: overwatch-db
        image: postgres:15-alpine
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        volumes:
            - overwatch-db-data:/var/lib/postgresql/data
        ports:
            - 127.0.0.1:${POSTGRES_PORT:-5437}:5432
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            interval: 10s
            timeout: 5s
            retries: 5
        logging:
            options:
                max-size: 10m
                max-file: "3"

    overwatch-app:
        container_name: overwatch-app
        image: overwatch-app
        build:
            context: .
            dockerfile: Dockerfile
            args:
                REACT_APP_AUTH0_DOMAIN_NAME: ${REACT_APP_AUTH0_DOMAIN_NAME}
                REACT_APP_AUTH0_CLIENT_ID: ${REACT_APP_AUTH0_CLIENT_ID}
        restart: unless-stopped
        environment:
            DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@overwatch-db:5432/${POSTGRES_DB}
            AUTH0_DOMAIN: ${REACT_APP_AUTH0_DOMAIN_NAME}
            PORT: 3000
        ports:
            - 8079:3000
        depends_on:
            overwatch-db:
                condition: service_healthy
        logging:
            options:
                max-size: 10m
                max-file: "3"

volumes:
    overwatch-db-data:
